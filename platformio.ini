[platformio]
description = 8-Ch Digital Audio Mixer for ESP32 with WebSocket
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

board_build.f_cpu = 240000000L
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv

build_flags =
    -DCORE_DEBUG_LEVEL=0

build_src_filter = +<main/*> +<libraries/YummyDSP/src/*>

lib_extra_dirs = libraries

lib_deps =
    bblanchon/ArduinoJson @ ^7.0

monitor_speed = 115200

[env:esp32dev-debug]
platform = espressif32
board = esp32dev
framework = arduino

board_build.f_cpu = 240000000L
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv

build_flags =
    -DCORE_DEBUG_LEVEL=4
    -DSERIAL_LOG=1

build_src_filter = +<main/*> +<libraries/YummyDSP/src/*>

lib_extra_dirs = libraries

lib_deps =
    bblanchon/ArduinoJson @ ^7.0

monitor_speed = 115200
